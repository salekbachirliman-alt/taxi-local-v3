<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#facc15">
  <title>Taxi Local — Elda y Petrer</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">🚕 TAXI LOCAL</div>
    <p>Elda · Petrer</p>
  </header>
  <main class="app-main">
    <section id="home-screen" class="screen active">
      <h1>¿Qué necesitas?</h1>
      <button class="primary-button" data-screen="request-screen">🚕 Pedir taxi</button>
      <button class="secondary-button" data-screen="driver-screen">👨‍✈️ Soy conductor</button>
      <p class="muted">Servicio piloto · Sin pagos en la app</p>
    </section>

    <section id="request-screen" class="screen">
      <h2>Pedir un taxi</h2>
      <form id="request-form" class="panel">
        <label for="city">Localidad</label>
        <select id="city" required><option>Elda</option><option>Petrer</option></select>
        <label for="customer-phone">Teléfono de contacto</label>
        <input id="customer-phone" type="tel" autocomplete="tel" required minlength="6" placeholder="Tu teléfono">
        <label for="pickup">Punto de recogida</label>
        <input id="pickup" required maxlength="160" placeholder="Calle y número o usa tu ubicación">
        <button id="locate-button" type="button" class="secondary-button">📍 Usar mi ubicación</button>
        <p id="location-status" class="muted" aria-live="polite"></p>
        <label for="destination">Destino (opcional)</label>
        <input id="destination" maxlength="160" placeholder="¿Adónde vas?">
        <label for="passengers">Pasajeros</label>
        <select id="passengers"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option></select>
        <label for="ride-notes">Notas (opcional)</label>
        <textarea id="ride-notes" maxlength="300" placeholder="Equipaje, silla infantil…"></textarea>
        <button type="submit" class="primary-button">Solicitar taxi</button>
      </form>
      <div id="ride-result" class="panel hidden" aria-live="polite"></div>
      <button class="text-button" data-screen="home-screen">← Volver</button>
    </section>

    <section id="driver-screen" class="screen">
      <h2>Zona de conductores</h2>
      <div id="auth-panel" class="panel">
        <div class="tabs">
          <button type="button" class="tab active" data-tab="login">Iniciar sesión</button>
          <button type="button" class="tab" data-tab="register">Crear cuenta</button>
        </div>
        <form id="login-form">
          <label for="login-email">Correo electrónico</label><input id="login-email" type="email" autocomplete="email" required>
          <label for="login-password">Contraseña</label><input id="login-password" type="password" autocomplete="current-password" required>
          <button class="primary-button" type="submit">Entrar</button>
        </form>
        <form id="register-form" class="hidden">
          <label for="register-name">Nombre completo</label><input id="register-name" required maxlength="100" autocomplete="name">
          <label for="register-phone">Teléfono</label><input id="register-phone" type="tel" required minlength="6" autocomplete="tel">
          <label for="register-town">Localidad base</label><select id="register-town"><option>Elda</option><option>Petrer</option></select>
          <label for="register-email">Correo electrónico</label><input id="register-email" type="email" required autocomplete="email">
          <label for="register-password">Contraseña (mínimo 8 caracteres)</label><input id="register-password" type="password" required minlength="8" autocomplete="new-password">
          <button class="primary-button" type="submit">Solicitar alta de conductor</button>
          <p class="muted">La cuenta de conductor necesita aprobación antes de recibir solicitudes.</p>
        </form>
      </div>
      <div id="driver-dashboard" class="panel hidden">
        <div class="dashboard-heading"><div><h3 id="driver-name">Conductor</h3><p id="driver-status" class="muted"></p></div><button id="logout-button" class="text-button" type="button">Salir</button></div>
        <div id="driver-pending" class="muted"></div>
        <button id="refresh-rides" type="button" class="secondary-button">Actualizar solicitudes</button>
      </div>
      <button class="text-button" data-screen="home-screen">← Volver</button>
    </section>
  </main>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <footer>Taxi Local · Elda y Petrer</footer>
</body>
</html>
